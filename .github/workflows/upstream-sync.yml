name: Upstream Release Sync

on:
  schedule:
    # 00:30 Asia/Shanghai = 16:30 UTC on the previous day.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  TARGET_BRANCH: codex2api-custom

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release baseline
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync the newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          # These files contain the custom multiplier, health-monitor and
          # mobile cost-detail behavior. Reapply their custom snapshot after
          # every merge so a clean upstream merge cannot silently replace it.
          custom_preserve_paths=(
            admin/account_response_builder.go
            admin/channel_monitor.go
            admin/channel_monitor_probe.go
            admin/channel_monitor_probe_test.go
            admin/handler.go
            admin/sub2_upstream_rate.go
            admin/system_update.go
            database/api_key_usage.go
            database/billing.go
            database/billing_test.go
            database/channel_monitor.go
            database/channel_monitor_test.go
            database/image_user_billing_test.go
            database/postgres.go
            database/sqlite.go
            database/sub2_upstream_billing.go
            database/sub2_upstream_billing_test.go
            database/usage_compaction_history_test.go
            docs/sub2api-upstream-billing-phase1.md
            frontend/src/api.ts
            frontend/src/components/AccountQuickConfigSheet.tsx
            frontend/src/components/ChannelMonitorConfigDialog.tsx
            frontend/src/components/Layout.tsx
            frontend/src/components/ui/tooltip.tsx
            frontend/src/lib/accountQuickConfig.ts
            frontend/src/locales/en.json
            frontend/src/locales/zh.json
            frontend/src/pages/APIKeyUsagePortal.tsx
            frontend/src/pages/Accounts.tsx
            frontend/src/pages/ChannelMonitor.tsx
            frontend/src/pages/Usage.tsx
            frontend/src/types.ts
            proxy/handler.go
            proxy/sub2_upstream_probe.go
            proxy/sub2_upstream_probe_test.go
          )
          custom_remove_paths=(
            frontend/src/lib/channelMonitorBilling.ts
            frontend/src/lib/channelMonitorBilling.test.mjs
          )

          is_custom_preserve_path() {
            local candidate="$1"
            local path
            for path in "${custom_preserve_paths[@]}"; do
              [[ "$candidate" == "$path" ]] && return 0
            done
            return 1
          }

          latest_tag=$(git ls-remote --tags --refs upstream 'v[0-9]*' \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          current_tag=$(sed -n '1p' .upstream-release 2>/dev/null || true)

          if [[ -z "$latest_tag" ]]; then
            echo "No semver release tag was found upstream."
            exit 0
          fi
          echo "current_release=${current_tag:-<none>}"
          echo "latest_release=${latest_tag}"

          if [[ "$latest_tag" == "$current_tag" ]]; then
            {
              echo "### Upstream release sync"
              echo
              echo "No new upstream release is available."
              echo "- Current release: \`${current_tag}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags upstream \
            "refs/tags/${latest_tag}:refs/tags/upstream-${latest_tag}"
          upstream_sha=$(git rev-parse "refs/tags/upstream-${latest_tag}^{commit}")

          # Rebuild main from the upstream release tree while retaining only
          # this scheduler and the release marker needed for the next run.
          scheduler_file=$(mktemp)
          git show "refs/remotes/origin/${TARGET_BRANCH}:.github/workflows/upstream-sync.yml" > "$scheduler_file"
          git read-tree --reset -u "$upstream_sha"
          mkdir -p .github/workflows
          cp "$scheduler_file" .github/workflows/upstream-sync.yml
          printf '%s\n' "$latest_tag" > .upstream-release
          rm -f "$scheduler_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream release ${latest_tag}"
          git push origin HEAD:refs/heads/main

          # Merge the same release into the custom branch. Custom behavior is
          # reapplied below even when Git can merge a file without conflict.
          git switch --create custom-sync "refs/remotes/origin/${TARGET_BRANCH}"
          merge_had_conflicts=false
          if ! git merge --no-edit --no-commit --no-ff "$upstream_sha"; then
            merge_had_conflicts=true
            while IFS= read -r path; do
              if is_custom_preserve_path "$path"; then
                git checkout --ours -- "$path"
              else
                git checkout --theirs -- "$path"
              fi
              git add -A -- "$path"
            done < <(git diff --name-only --diff-filter=U)
          fi

          # Reapply the complete custom snapshot after the merge. This also
          # covers files where upstream changes merged cleanly and therefore
          # never appeared in the unmerged path list above.
          for path in "${custom_preserve_paths[@]}"; do
            if git cat-file -e "refs/remotes/origin/${TARGET_BRANCH}:${path}" 2>/dev/null; then
              git checkout "refs/remotes/origin/${TARGET_BRANCH}" -- "$path"
              git add -A -- "$path"
            else
              git rm -f --ignore-unmatch -- "$path"
            fi
          done
          for path in "${custom_remove_paths[@]}"; do
            git rm -f --ignore-unmatch -- "$path"
          done

          # Upstream 3.0.2+ contains a second channel billing-rate feature.
          # It must never return alongside the custom Sub2API probe, even via
          # a clean merge. Fail before publishing if any forbidden contract is
          # present in the resulting custom tree.
          contract_failed=false
          for path in "${custom_remove_paths[@]}"; do
            if [[ -e "$path" ]]; then
              echo "Custom contract violation: forbidden file exists: $path" >&2
              contract_failed=true
            fi
          done
          if rg -n --hidden --glob '!.git/**' --glob '!CHANGELOG.md' --glob '!docs/**' \
            --glob '!test-results/**' --glob '!.github/workflows/upstream-sync.yml' \
            -e 'ChannelMonitorBilling' \
            -e 'channelMonitorBilling' \
            -e 'BillingRates' \
            -e 'probeResponsesBilling' \
            -e 'RecordChannelMonitorBilling' \
            -e '/channel-monitors/billing-rates' .; then
            echo "Custom contract violation: upstream channel billing-rate code is present" >&2
            contract_failed=true
          fi
          if [[ "$contract_failed" == true ]]; then
            exit 1
          fi

          printf '%s\n' "$latest_tag" > .upstream-release
          git add -A
          if ! git diff --cached --quiet; then
            if [[ "$merge_had_conflicts" == true ]]; then
              git commit -m "chore: sync upstream release ${latest_tag} preserving custom billing"
            else
              git commit -m "chore: sync upstream release ${latest_tag}"
            fi
          fi

          custom_sha=$(git rev-parse HEAD)
          expected_custom_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_custom_sha}" \
            origin "${custom_sha}:refs/heads/${TARGET_BRANCH}"

          {
            echo "### Upstream release sync"
            echo
            echo "Synchronized upstream release \`${latest_tag}\` (${upstream_sha})."
            echo "- main baseline updated"
            echo "- custom branch updated: \`${custom_sha}\`"
            echo "- custom multiplier, channel health-monitor and mobile cost-detail files were reapplied"
            echo "- upstream channel billing-rate implementation was removed and checked"
          } >> "$GITHUB_STEP_SUMMARY"
