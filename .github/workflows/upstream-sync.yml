name: Upstream Release Sync

on:
  schedule:
    # 00:30 Asia/Shanghai = 16:30 UTC on the previous day.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  TARGET_BRANCH: codex2api-custom

jobs:
  prepare-main-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release baseline
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create upstream baseline PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          expected_main_sha=$(git rev-parse refs/remotes/origin/main)
          expected_custom_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git reset --hard "$expected_main_sha"

          read_marker() {
            git show "$1:.upstream-release" 2>/dev/null | sed -n '1p' || true
          }
          current_main_tag=$(read_marker "$expected_main_sha")
          current_custom_tag=$(read_marker "$expected_custom_sha")

          latest_tag=$(git ls-remote --tags --refs upstream 'v[0-9]*' \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)
          if [[ -z "$latest_tag" ]]; then
            echo "No semver release tag was found upstream."
            exit 0
          fi
          echo "current_main_release=${current_main_tag:-<none>}"
          echo "current_custom_release=${current_custom_tag:-<none>}"
          echo "latest_release=${latest_tag}"

          marker_ahead_of_latest() {
            local marker="$1"
            [[ -z "$marker" ]] && return 1
            [[ "$marker" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || return 1
            [[ "$marker" != "$latest_tag" && "$(printf '%s\n' "$latest_tag" "$marker" | sort -V | tail -n 1)" == "$marker" ]]
          }
          if marker_ahead_of_latest "$current_main_tag" || marker_ahead_of_latest "$current_custom_tag"; then
            echo "A release marker is newer than upstream ${latest_tag}; refusing to roll branches back." >&2
            exit 1
          fi

          if [[ "$latest_tag" == "$current_main_tag" && "$latest_tag" == "$current_custom_tag" ]]; then
            {
              echo "### Upstream release sync"
              echo
              echo "No new upstream release is available."
              echo "- Current release: \`${latest_tag}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags upstream \
            "refs/tags/${latest_tag}:refs/tags/upstream-${latest_tag}"
          upstream_sha=$(git rev-parse "refs/tags/upstream-${latest_tag}^{commit}")

          # Main follows the upstream tree, with maintained automation files
          # and a narrow source-map-js security patch preserved.
          preserve_dir=$(mktemp -d)
          trap 'rm -rf "$preserve_dir"' EXIT
          for path in \
            .github/workflows/release.yml \
            .github/workflows/upstream-release.yml \
            .github/workflows/upstream-sync.yml \
            .github/workflows/upstream-custom-sync.yml \
            .github/workflows/pr-check.yml \
            .github/workflows/security-scan.yml \
            .github/scripts/dispatch-pr-checks.sh \
            .github/scripts/patch-source-map-js-lock.mjs; do
            mkdir -p "$preserve_dir/$(dirname "$path")"
            git show "refs/remotes/origin/${TARGET_BRANCH}:${path}" > "$preserve_dir/$path"
          done

          baseline_branch="sync/baseline-${latest_tag}"
          git switch --create "$baseline_branch" "$expected_main_sha"
          git read-tree --reset -u "$upstream_sha"
          for path in \
            .github/workflows/release.yml \
            .github/workflows/upstream-release.yml \
            .github/workflows/upstream-sync.yml \
            .github/workflows/upstream-custom-sync.yml \
            .github/workflows/pr-check.yml \
            .github/workflows/security-scan.yml \
            .github/scripts/dispatch-pr-checks.sh \
            .github/scripts/patch-source-map-js-lock.mjs; do
            mkdir -p "$(dirname "$path")"
            cp "$preserve_dir/$path" "$path"
          done
          node .github/scripts/patch-source-map-js-lock.mjs frontend/package-lock.json
          printf '%s\n' "$latest_tag" > .upstream-release

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The upstream release tree produces no baseline changes."
            exit 0
          fi
          git commit -m "chore: sync upstream release ${latest_tag} into main"

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$baseline_branch" \
            --json number \
            --jq '.[0].number // empty')
          existing_branch_sha=$(git ls-remote origin "refs/heads/${baseline_branch}" | awk 'NR == 1 { print $1 }')
          if [[ -n "$existing_branch_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/${baseline_branch}:${existing_branch_sha}" \
              origin "${baseline_branch}:refs/heads/${baseline_branch}"
          else
            git push origin "${baseline_branch}:refs/heads/${baseline_branch}"
          fi

          if [[ -z "$existing_pr" ]]; then
            pr_body_file=$(mktemp)
            trap 'rm -f "$pr_body_file"; rm -rf "$preserve_dir"' EXIT
            cat > "$pr_body_file" <<EOF
          ## Upstream baseline sync

          This PR updates \`main\` to upstream release ${latest_tag}.

          - The upstream release tree is the main branch baseline.
          - The scheduler and protected CI workflow files are retained.
          - The custom branch is not changed by this PR.
          - After merge, the custom synchronization workflow will create the PR into \`codex2api-custom\`.
          EOF
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$baseline_branch" \
              --title "chore: sync upstream release ${latest_tag} into main" \
              --body-file "$pr_body_file")
          else
            pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${existing_pr}"
          fi

          pr_number=${pr_url##*/}
          pr_head_sha=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          expected_head_sha=$(git rev-parse "$baseline_branch")
          if [[ "$pr_head_sha" != "$expected_head_sha" ]]; then
            echo "Baseline PR #${pr_number} head does not match the prepared upstream commit." >&2
            exit 1
          fi
          bash .github/scripts/dispatch-pr-checks.sh "$baseline_branch" "$pr_head_sha" main "$pr_number"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --merge --delete-branch

          merged=false
          for attempt in $(seq 1 100); do
            pr_json=$(gh pr view "$pr_url" --json state,mergedAt,statusCheckRollup)
            pr_state=$(jq -r '.state // ""' <<< "$pr_json")
            if [[ "$pr_state" == "MERGED" ]]; then
              merged=true
              break
            fi

            failed_checks=$(jq -r '[.statusCheckRollup[]? | select((.conclusion // "") | ascii_downcase | IN("failure", "cancelled", "timed_out", "action_required", "startup_failure")) | .name] | join(", ")' <<< "$pr_json")
            if [[ -n "$failed_checks" ]]; then
              echo "Upstream baseline PR has failed checks: ${failed_checks}" >&2
              exit 1
            fi
            if [[ "$pr_state" == "CLOSED" ]]; then
              echo "The upstream baseline PR closed without merging: ${pr_url}" >&2
              exit 1
            fi
            sleep 15
          done
          if [[ "$merged" != true ]]; then
            echo "Timed out waiting for the upstream baseline PR to merge: ${pr_url}" >&2
            exit 1
          fi

          # A bot-created PR merge does not reliably emit pull_request:closed
          # for the next workflow. workflow_dispatch is an explicit trigger
          # supported by GITHUB_TOKEN, so dispatch the custom stage after the
          # protected main merge is confirmed.
          gh workflow run 'Merge Upstream Baseline Into Custom' \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

          {
            echo "### Upstream baseline sync"
            echo
            echo "Prepared upstream release \`${latest_tag}\` as a protected main PR."
            echo "- baseline branch: \`${baseline_branch}\`"
            echo "- PR: ${pr_url}"
            echo "- main remains unchanged until the required checks pass"
            echo "- custom synchronization was dispatched after the protected main merge"
          } >> "$GITHUB_STEP_SUMMARY"
