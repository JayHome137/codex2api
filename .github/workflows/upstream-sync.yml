name: Upstream Sync

on:
  schedule:
    # GitHub Actions cron uses UTC; this runs once per day.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  SYNC_BRANCH: automation/upstream-sync

jobs:
  detect-and-open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout own main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Compare upstream main and update sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git fetch --no-tags upstream main:refs/remotes/upstream/main

          own_sha=$(git rev-parse refs/remotes/origin/main)
          upstream_sha=$(git rev-parse refs/remotes/upstream/main)
          echo "own_main_sha=${own_sha}"
          echo "upstream_main_sha=${upstream_sha}"

          if git merge-base --is-ancestor "$upstream_sha" "$own_sha"; then
            echo "upstream_status=already-in-main"
            {
              echo "### Upstream sync"
              echo
              echo "No new upstream commit is waiting to be merged."
              echo
              echo "- Own main: `${own_sha}`"
              echo "- Upstream main: `${upstream_sha}`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sync_ref="refs/heads/${SYNC_BRANCH}"
          existing_sync_sha=$(git ls-remote origin "$sync_ref" | awk 'NR == 1 { print $1 }')
          if [[ -n "$existing_sync_sha" ]]; then
            git push --force-with-lease="$sync_ref:$existing_sync_sha" \
              origin "refs/remotes/upstream/main:$sync_ref"
          else
            git push origin "refs/remotes/upstream/main:$sync_ref"
          fi

          body_file=$(mktemp)
          trap 'rm -f "$body_file"' EXIT
          cat > "$body_file" <<EOF
          ## Upstream update detected

          This PR is maintained by the daily upstream sync workflow.

          - Upstream repository: \`${UPSTREAM_REPOSITORY}\`
          - Upstream commit: \`${upstream_sha}\`
          - Current own \`main\`: \`${own_sha}\`

          The branch contains the upstream \`main\` tree. Existing CI will report build and test results, while GitHub will report whether the PR can be merged cleanly. This workflow never merges the PR automatically.
          EOF

          pr_number=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base main \
            --head "$SYNC_BRANCH" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "chore: sync upstream main" \
              --body-file "$body_file"
            pr_url=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json url --jq '.url')
            echo "pull_request_action=updated"
          else
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream main" \
              --body-file "$body_file")
            echo "pull_request_action=created"
          fi

          {
            echo "### Upstream sync"
            echo
            echo "A sync PR was created or updated."
            echo
            echo "- PR: ${pr_url}"
            echo "- Upstream commit: `${upstream_sha}`"
            echo "- Own main before sync: `${own_sha}`"
            echo
            echo "The PR page shows merge conflicts separately from CI checks."
          } >> "$GITHUB_STEP_SUMMARY"
