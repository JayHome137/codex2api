name: Upstream Release Sync

on:
  schedule:
    # 00:30 Asia/Shanghai = 16:30 UTC on the previous day.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release-sync
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  TARGET_BRANCH: codex2api-custom

jobs:
  sync-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release baseline
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Sync the newest upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          latest_tag=$(git ls-remote --tags --refs upstream 'v[0-9]*' \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          current_tag=$(sed -n '1p' .upstream-release 2>/dev/null || true)

          if [[ -z "$latest_tag" ]]; then
            echo "No semver release tag was found upstream."
            exit 0
          fi
          echo "current_release=${current_tag:-<none>}"
          echo "latest_release=${latest_tag}"

          if [[ "$latest_tag" == "$current_tag" ]]; then
            {
              echo "### Upstream release sync"
              echo
              echo "No new upstream release is available."
              echo "- Current release: \`${current_tag}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git fetch --no-tags upstream \
            "refs/tags/${latest_tag}:refs/tags/upstream-${latest_tag}"
          upstream_sha=$(git rev-parse "refs/tags/upstream-${latest_tag}^{commit}")

          # Rebuild main from the upstream release tree while retaining only
          # this scheduler and the release marker needed for the next run.
          scheduler_file=$(mktemp)
          git show "refs/remotes/origin/${TARGET_BRANCH}:.github/workflows/upstream-sync.yml" > "$scheduler_file"
          git read-tree --reset -u "$upstream_sha"
          mkdir -p .github/workflows
          cp "$scheduler_file" .github/workflows/upstream-sync.yml
          printf '%s\n' "$latest_tag" > .upstream-release
          rm -f "$scheduler_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync upstream release ${latest_tag}"
          git push origin HEAD:refs/heads/main

          # Merge the same release into the custom branch. Only the files that
          # carry upstream-billing behavior prefer the custom side on conflict.
          git switch --create custom-sync "refs/remotes/origin/${TARGET_BRANCH}"
          merge_had_conflicts=false
          if ! git merge --no-edit --no-commit --no-ff "$upstream_sha"; then
            merge_had_conflicts=true
            while IFS= read -r path; do
              case "$path" in
                admin/account_response_builder.go|admin/handler.go|admin/sub2_upstream_rate.go|admin/system_update.go|database/api_key_usage.go|database/billing.go|database/billing_test.go|database/image_user_billing_test.go|database/postgres.go|database/sqlite.go|database/sub2_upstream_billing.go|database/sub2_upstream_billing_test.go|database/usage_compaction_history_test.go|docs/sub2api-upstream-billing-phase1.md|frontend/src/api.ts|frontend/src/components/AccountQuickConfigSheet.tsx|frontend/src/components/Layout.tsx|frontend/src/lib/accountQuickConfig.ts|frontend/src/locales/en.json|frontend/src/locales/zh.json|frontend/src/pages/APIKeyUsagePortal.tsx|frontend/src/pages/Accounts.tsx|frontend/src/pages/Usage.tsx|frontend/src/types.ts|proxy/handler.go|proxy/sub2_upstream_probe.go|proxy/sub2_upstream_probe_test.go)
                  git checkout --ours -- "$path"
                  ;;
                *)
                  git checkout --theirs -- "$path"
                  ;;
              esac
              git add -A -- "$path"
            done < <(git diff --name-only --diff-filter=U)
          fi

          git add -A
          if [[ "$merge_had_conflicts" == true ]]; then
            git commit -m "chore: sync upstream release ${latest_tag} preserving custom billing"
          else
            git commit -m "chore: sync upstream release ${latest_tag}"
          fi

          custom_sha=$(git rev-parse HEAD)
          expected_custom_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git push --force-with-lease="refs/heads/${TARGET_BRANCH}:${expected_custom_sha}" \
            origin "${custom_sha}:refs/heads/${TARGET_BRANCH}"

          {
            echo "### Upstream release sync"
            echo
            echo "Synchronized upstream release \`${latest_tag}\` (`${upstream_sha}\`)."
            echo "- main baseline updated"
            echo "- custom branch updated: \`${custom_sha}\`"
            echo "- conflict policy: custom billing files prefer custom; all other conflicts prefer upstream"
          } >> "$GITHUB_STEP_SUMMARY"
