name: Merge Upstream Baseline Into Custom

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  # The waiter reads the combined commit status.
  statuses: read

concurrency:
  group: upstream-custom-sync
  cancel-in-progress: false

env:
  TARGET_BRANCH: codex2api-custom

jobs:
  prepare-custom-pr:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout main baseline
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Create custom synchronization PR
        env:
          GH_TOKEN: ${{ github.token }}
          # See upstream-sync.yml. When unset, commit statuses stand in for
          # the approval-gated pull_request workflows.
          UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          # Release promotion sources this same file from the custom checkout.
          # Load it from origin/codex2api-custom here too, so conflict
          # resolution cannot follow a stale copy that arrived via main.
          catalog=$(mktemp)
          git show "refs/remotes/origin/${TARGET_BRANCH}:.github/scripts/dispatch-pr-checks.sh" > "$catalog"
          # shellcheck disable=SC1090
          source "$catalog"
          rm -f "$catalog"
          configure_upstream_sync_token

          main_sha=$(git rev-parse refs/remotes/origin/main)
          expected_custom_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          git reset --hard "$main_sha"

          read_marker() {
            git show "$1:.upstream-release" 2>/dev/null | sed -n '1p' || true
          }
          main_tag=$(read_marker "$main_sha")
          custom_tag=$(read_marker "$expected_custom_sha")
          if [[ ! "$main_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "main does not declare a valid upstream release marker; nothing to merge."
            exit 0
          fi
          echo "main_release=${main_tag}"
          echo "custom_release=${custom_tag:-<none>}"

          if [[ "$main_tag" == "$custom_tag" ]]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${main_tag}" >/dev/null 2>&1; then
              {
                echo "### Custom synchronization"
                echo
                echo "The custom branch and latest release are already at ${main_tag}."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            custom_pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${expected_custom_sha}/pulls" \
              --jq "[.[] | select(.base.ref == \"${TARGET_BRANCH}\" and .merged_at != null)] | sort_by(.merged_at) | last | .number // empty")
            if [[ -z "$custom_pr" ]]; then
              echo "${main_tag} is already on ${TARGET_BRANCH}, but no merged PR identifies its validated source." >&2
              exit 1
            fi
            # Run the workflow file from the custom branch. main's copy drifts
            # behind codex2api-custom between baseline merges.
            gh workflow run 'Publish Custom Release' \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$TARGET_BRANCH" \
              -f "source_sha=${expected_custom_sha}" \
              -f "pr_number=${custom_pr}"
            {
              echo "### Custom synchronization"
              echo
              echo "The custom branch already contains ${main_tag}; release publication was dispatched from its merged PR."
              echo "- source commit: \`${expected_custom_sha}\`"
              echo "- PR: #${custom_pr}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Preserve and remove lists live in dispatch-pr-checks.sh so the
          # release contract cannot drift from conflict resolution.
          is_custom_preserve_path() {
            local candidate="$1"
            local path
            for path in "${custom_preserve_paths[@]}"; do
              [[ "$candidate" == "$path" ]] && return 0
            done
            return 1
          }

          sync_branch="sync/upstream-${main_tag}"
          git switch --create "$sync_branch" "refs/remotes/origin/${TARGET_BRANCH}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          merge_had_conflicts=false
          preserved_conflict_paths=()
          preserved_report=$(mktemp)
          if ! git merge --no-edit --no-commit --no-ff "$main_sha"; then
            merge_had_conflicts=true
            # A conflicted merge can leave this runner's index lock behind
            # before the conflict-resolution loop starts. No other Git process
            # runs in this step, so remove only that stale lock before writes.
            if [[ -f .git/index.lock ]]; then
              rm -f .git/index.lock
            fi
            merge_base=$(git merge-base HEAD "$main_sha")
            mapfile -t conflicted_paths < <(git diff --name-only --diff-filter=U)
            for path in "${conflicted_paths[@]}"; do
              if is_custom_preserve_path "$path"; then
                # Custom content stays. Record the upstream delta this drops
                # so a reviewer can put non-conflicting additions back.
                preserved_conflict_paths+=("$path")
                upstream_delta=$(git diff --no-color --unified=3 "$merge_base" "$main_sha" -- "$path" || true)
                {
                  echo "### \`$path\`"
                  echo
                  echo "Kept the custom file. Upstream changes since the merge base that were not applied:"
                  echo
                  if [[ -z "$upstream_delta" ]]; then
                    echo "_No textual upstream delta._"
                  else
                    echo '```diff'
                    printf '%s\n' "${upstream_delta:0:8000}"
                    if [[ "${#upstream_delta}" -gt 8000 ]]; then
                      echo
                      echo "... diff truncated ..."
                    fi
                    echo '```'
                  fi
                  echo
                } >> "$preserved_report"
                git checkout --ours -- "$path" 2>/dev/null || git rm -f --ignore-unmatch -- "$path"
              else
                git checkout --theirs -- "$path" 2>/dev/null || git rm -f --ignore-unmatch -- "$path"
              fi
              if [[ -e "$path" || -L "$path" ]]; then
                git add -- "$path"
              fi
            done
          fi

          for path in "${custom_remove_paths[@]}"; do
            git rm -f --ignore-unmatch -- "$path"
          done

          # main's pre-fix copier does not put this script on the baseline.
          # The worktree is the custom branch by this point, which has it.
          # Restore from the custom ref if a merge resolution dropped it.
          if [[ ! -f .github/scripts/verify-custom-contract.sh ]]; then
            git checkout "refs/remotes/origin/${TARGET_BRANCH}" -- .github/scripts/verify-custom-contract.sh
          fi
          bash .github/scripts/verify-custom-contract.sh
          printf '%s\n' "$main_tag" > .upstream-release
          git add -u
          git add .upstream-release
          if [[ "$merge_had_conflicts" == true ]]; then
            sync_message="chore: sync upstream release ${main_tag} preserving custom billing"
          else
            sync_message="chore: sync upstream release ${main_tag}"
          fi
          bash .github/scripts/dispatch-pr-checks.sh --reuse-or-push "$sync_branch" "$sync_message"

          custom_sha=$(git rev-parse HEAD)
          if [[ "$custom_sha" == "$main_sha" ]]; then
            echo "Custom candidate unexpectedly equals main; refusing to publish." >&2
            exit 1
          fi

          existing_pr=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --base "$TARGET_BRANCH" \
            --head "$sync_branch" \
            --json number \
            --jq '.[0].number // empty')

          if [[ -z "$existing_pr" ]]; then
            pr_body_file=$(mktemp)
            trap 'rm -f "$pr_body_file"' EXIT
            cat > "$pr_body_file" <<EOF
          ## Upstream release sync

          This PR merges the validated main baseline for ${main_tag} into ${TARGET_BRANCH}.

          - Custom multiplier, billing, channel-monitor, mobile-display, and deployment-source behavior is protected on conflicts.
          - All other files follow the already validated main baseline.
          - The custom contract, CI, and security checks must pass before merge.
          - The custom Release is published only after this PR is merged.
          EOF
            if ((${#preserved_conflict_paths[@]} > 0)); then
              {
                echo
                echo "Preserve-list files conflicted. Custom content was kept whole, and this PR will not auto-merge or publish a release:"
                for path in "${preserved_conflict_paths[@]}"; do
                  echo "- \`$path\`"
                done
              } >> "$pr_body_file"
            fi
            pr_url=$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base "$TARGET_BRANCH" \
              --head "$sync_branch" \
              --title "chore: sync upstream release ${main_tag}" \
              --body-file "$pr_body_file")
            pr_number=${pr_url##*/}
          else
            pr_url="https://github.com/${GITHUB_REPOSITORY}/pull/${existing_pr}"
            pr_number="$existing_pr"
          fi

          pr_head_sha=""
          for attempt in $(seq 1 20); do
            pr_head_sha=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid' 2>/dev/null || true)
            if [[ "$pr_head_sha" == "$custom_sha" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$pr_head_sha" != "$custom_sha" ]]; then
            echo "Custom PR #${pr_number} head does not match the prepared synchronization commit after waiting for GitHub to converge." >&2
            echo "expected=${custom_sha} actual=${pr_head_sha:-<empty>}" >&2
            exit 1
          fi
          if ((${#preserved_conflict_paths[@]} > 0)); then
            # Checks still run so the open PR is reviewable. Auto-merge and
            # Publish Custom Release stay off until a person merges it.
            gh label create preserve-conflict \
              --repo "$GITHUB_REPOSITORY" \
              --description "Preserve-list merge kept custom and dropped upstream hunks" \
              --color B60205 >/dev/null 2>&1 || true
            gh pr edit "$pr_number" --repo "$GITHUB_REPOSITORY" --add-label preserve-conflict >/dev/null 2>&1 || true
            comment_file=$(mktemp)
            {
              echo "Preserve-list files conflicted. Each file below was kept from \`${TARGET_BRANCH}\` so custom content is unchanged."
              echo
              echo "This PR will not auto-merge, and no release will be published until it is merged by a reviewer."
              echo
              cat "$preserved_report"
            } > "$comment_file"
            gh pr comment "$pr_number" --repo "$GITHUB_REPOSITORY" --body-file "$comment_file"
            bash .github/scripts/dispatch-pr-checks.sh "$sync_branch" "$pr_head_sha" "$TARGET_BRANCH" "$pr_number"
            {
              echo "### Custom synchronization"
              echo
              echo "Opened ${pr_url} for review because preserve-list files conflicted."
              echo "- PR: ${pr_url}"
              echo "- files: ${preserved_conflict_paths[*]}"
              echo "- auto-merge: withheld"
              echo "- release: not dispatched"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bash .github/scripts/dispatch-pr-checks.sh "$sync_branch" "$pr_head_sha" "$TARGET_BRANCH" "$pr_number"
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --merge --delete-branch

          merged_sha=""
          for attempt in $(seq 1 80); do
            pr_json=$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json state,mergedAt,mergeCommit,statusCheckRollup)
            pr_state=$(jq -r '.state // ""' <<< "$pr_json")
            merged_sha=$(jq -r '.mergeCommit.oid // ""' <<< "$pr_json")
            if [[ "$pr_state" == "MERGED" && -n "$merged_sha" ]]; then
              break
            fi

            # Same rule as the baseline wait: only a failed required
            # context aborts. Missing checks wait; auto-merge cannot
            # complete until branch protection is satisfied.
            failed_checks=$(bash .github/scripts/dispatch-pr-checks.sh --failed-required-checks "$pr_number" "$TARGET_BRANCH")
            if [[ -n "$failed_checks" ]]; then
              echo "Custom PR #${pr_number} has failed checks: ${failed_checks}" >&2
              exit 1
            fi
            if [[ "$pr_state" == "CLOSED" ]]; then
              echo "Custom PR #${pr_number} closed without merging." >&2
              exit 1
            fi
            if [[ "$attempt" == 80 ]]; then
              echo "Timed out waiting for protected custom PR #${pr_number} to merge." >&2
              exit 1
            fi
            sleep 15
          done

          git fetch --no-tags origin "refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          current_custom_sha=$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")
          if [[ "$current_custom_sha" != "$merged_sha" ]]; then
            echo "Custom branch advanced beyond PR #${pr_number}; refusing to publish a stale commit." >&2
            exit 1
          fi

          # Run the workflow file from the custom branch so the release contract
          # and release notes match the commit being published, not main.
          gh workflow run 'Publish Custom Release' \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TARGET_BRANCH" \
            -f "source_sha=${merged_sha}" \
            -f "pr_number=${pr_number}"

          {
            echo "### Custom synchronization"
            echo
            echo "Prepared ${main_tag} as a protected custom PR."
            echo "- sync branch: \`${sync_branch}\`"
            echo "- PR: ${pr_url}"
            echo "- merged commit: \`${merged_sha}\`"
            echo "- Release was explicitly dispatched after the required checks passed"
            echo "- custom behavior was protected on merge conflicts"
          } >> "$GITHUB_STEP_SUMMARY"
