name: Delete Merged Upstream Sync Branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-sync-branch:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'sync/upstream-') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged synchronization branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gh pr merge --delete-branch and the repository's
          # delete-branch-on-merge setting often remove the ref before this
          # pull_request closed workflow starts.
          if response=$(gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>&1); then
            echo "Deleted ${BRANCH}."
            exit 0
          fi
          if grep -q "Reference does not exist" <<<"$response"; then
            echo "Branch ${BRANCH} is already deleted."
            exit 0
          fi
          printf '%s\n' "$response" >&2
          exit 1
