name: Delete Merged Pull Request Branch

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-head-branch:
    # Same-repo heads only. Fork branches are not ours to delete.
    # main and codex2api-custom are long-lived; never delete them even if a
    # pull request names one of them as its head. The repository setting
    # delete_branch_on_merge and `gh pr merge --delete-branch` already remove
    # most heads. This job is the backstop for every remaining same-repo head,
    # including sync/baseline-*, sync/upstream-*, and cursor/*.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main' &&
      github.event.pull_request.head.ref != 'codex2api-custom' &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged pull request head branch
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Second gate. The job if above should already skip these. This
          # refuses the API call even if that filter is edited later.
          is_protected_branch() {
            local name lowered default_lowered
            name="$1"
            lowered=$(printf '%s' "$name" | tr '[:upper:]' '[:lower:]')
            default_lowered=$(printf '%s' "${DEFAULT_BRANCH:-}" | tr '[:upper:]' '[:lower:]')
            [[ "$lowered" == "main" || "$lowered" == "codex2api-custom" || "$lowered" == "refs/heads/main" || "$lowered" == "refs/heads/codex2api-custom" || ( -n "$default_lowered" && "$lowered" == "$default_lowered" ) ]]
          }

          if [[ -z "$BRANCH" || "$BRANCH" == "." || "$BRANCH" == ".." || "$BRANCH" == /* || "$BRANCH" == *"/.." || "$BRANCH" == *"/../"* || "$BRANCH" == *"//"* || "$BRANCH" == *" "* || "$BRANCH" == *'\'* ]]; then
            echo "Refusing to delete unsafe branch name: ${BRANCH}" >&2
            exit 1
          fi
          if is_protected_branch "$BRANCH"; then
            echo "Refusing to delete protected branch ${BRANCH}." >&2
            exit 1
          fi

          # gh pr merge --delete-branch and the repository's
          # delete-branch-on-merge setting often remove the ref before this
          # pull_request closed workflow starts. A missing ref is success.
          if response=$(gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" 2>&1); then
            echo "Deleted ${BRANCH}."
            exit 0
          fi
          if grep -q "Reference does not exist" <<<"$response"; then
            echo "Branch ${BRANCH} is already deleted."
            exit 0
          fi
          printf '%s\n' "$response" >&2
          exit 1
