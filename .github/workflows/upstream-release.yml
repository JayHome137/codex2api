name: Publish Custom Release

on:
  push:
    branches:
      - codex2api-custom
  workflow_dispatch:
    inputs:
      source_sha:
        description: Merged commit on codex2api-custom to release
        required: true
        type: string
      pr_number:
        description: Merged custom-branch PR whose required checks passed
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  # A single release lane prevents two custom commits from racing for the
  # same upstream version tag. New commits wait for the current validation.
  group: custom-release
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  TARGET_BRANCH: codex2api-custom

jobs:
  promote-validated-custom:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      should_release: ${{ steps.promote.outputs.should_release }}
      release_tag: ${{ steps.promote.outputs.release_tag }}
      source_sha: ${{ steps.promote.outputs.source_sha }}
    steps:
      - name: Checkout validated custom commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          fetch-depth: 0

      - name: Verify checks and promote the upstream version
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          PR_NUMBER: ${{ inputs.pr_number || '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "workflow_dispatch requires a full source SHA and merged PR number." >&2
              exit 1
            fi

            pr_json=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --json baseRefName,state,mergedAt,mergeCommit,statusCheckRollup)
            pr_base=$(jq -r '.baseRefName // ""' <<< "$pr_json")
            pr_state=$(jq -r '.state // ""' <<< "$pr_json")
            pr_merge_sha=$(jq -r '.mergeCommit.oid // ""' <<< "$pr_json")
            custom_head=$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 { print $1 }')
            if [[ "$pr_base" != "$TARGET_BRANCH" || "$pr_state" != "MERGED" || \
              "$pr_merge_sha" != "$SOURCE_SHA" || "$custom_head" != "$SOURCE_SHA" ]]; then
              echo "Release source is not the current merged commit from ${TARGET_BRANCH}." >&2
              exit 1
            fi

            required_checks=(
              custom-contract
              frontend
              golangci-lint
              test
              postgres-compatibility
              'test-race (proxy-a-g)'
              'test-race (proxy-h-z)'
              'test-race (admin)'
              'test-race (database)'
              'test-race (promptfilter)'
              'test-race (rest)'
              backend-security
              frontend-security
            )
            for check in "${required_checks[@]}"; do
              conclusion=$(jq -r --arg name "$check" \
                '[.statusCheckRollup[]? | select(.name == $name) | (.conclusion // .state // "")] | last // ""' \
                <<< "$pr_json")
              if [[ "${conclusion,,}" != "success" ]]; then
                echo "Required check ${check} did not pass for PR #${PR_NUMBER}: ${conclusion:-missing}." >&2
                exit 1
              fi
            done
          else
            ci_conclusion=""
            security_conclusion=""
            for attempt in $(seq 1 60); do
              runs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100")
              ci_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "CI" and .head_branch == env.TARGET_BRANCH and .head_sha == env.SOURCE_SHA)] | sort_by(.created_at) | last | .conclusion // ""' <<< "$runs_json")
              security_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "Security Scan" and .head_branch == env.TARGET_BRANCH and .head_sha == env.SOURCE_SHA)] | sort_by(.created_at) | last | .conclusion // ""' <<< "$runs_json")
              ci_status=$(jq -r '[.workflow_runs[] | select(.name == "CI" and .head_branch == env.TARGET_BRANCH and .head_sha == env.SOURCE_SHA)] | sort_by(.created_at) | last | .status // ""' <<< "$runs_json")
              security_status=$(jq -r '[.workflow_runs[] | select(.name == "Security Scan" and .head_branch == env.TARGET_BRANCH and .head_sha == env.SOURCE_SHA)] | sort_by(.created_at) | last | .status // ""' <<< "$runs_json")
              if [[ "$ci_conclusion" == "success" && "$security_conclusion" == "success" ]]; then
                break
              fi
              if [[ "$ci_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure)$ || "$security_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure)$ ]]; then
                echo "CI or Security Scan failed: CI=${ci_conclusion:-$ci_status}, Security=${security_conclusion:-$security_status}" >&2
                exit 1
              fi
              if [[ "$attempt" == 60 ]]; then
                echo "Timed out waiting for CI and Security Scan: CI=${ci_conclusion:-$ci_status}, Security=${security_conclusion:-$security_status}" >&2
                exit 1
              fi
              sleep 30
            done
          fi

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          upstream_tag=$(sed -n '1p' .upstream-release 2>/dev/null || true)
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "The custom branch does not declare a valid upstream release marker; no release will be promoted."
            exit 0
          fi
          if ! git ls-remote --exit-code --refs upstream "refs/tags/${upstream_tag}" >/dev/null; then
            echo "The declared upstream release ${upstream_tag} is not available upstream; no release will be promoted."
            exit 0
          fi

          git fetch --no-tags upstream "refs/tags/${upstream_tag}:refs/tags/upstream-${upstream_tag}"
          upstream_tag_sha=$(git rev-parse "refs/tags/upstream-${upstream_tag}^{commit}")

          if ! git diff --quiet "$upstream_tag_sha" "$SOURCE_SHA" -- frontend/package-lock.json; then
            UPSTREAM_TAG_SHA="$upstream_tag_sha" SOURCE_SHA="$SOURCE_SHA" node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const readLock = (ref) => JSON.parse(execFileSync('git', [
            'show', `${ref}:frontend/package-lock.json`,
          ], { encoding: 'utf8' }));
          const upstream = readLock(process.env.UPSTREAM_TAG_SHA);
          const custom = readLock(process.env.SOURCE_SHA);
          const packagePath = 'node_modules/source-map-js';
          const upstreamPackage = upstream.packages?.[packagePath];
          const customPackage = custom.packages?.[packagePath];

          if (!upstreamPackage || !customPackage || upstreamPackage.version !== '1.2.1' ||
              customPackage.version !== '1.2.2' ||
              customPackage.resolved !== 'https://registry.npmjs.org/source-map-js/-/source-map-js-1.2.2.tgz' ||
              customPackage.integrity !== 'sha512-KGj/8Y43x35aZVDtt+J4mK1hoLGHULMYfSkODJNQjNDC3oW1PqPoxMwo0pLUsWM/UEGzON/NxeHywEfNXNP3Vw==') {
            throw new Error('The package-lock exception is not the reviewed source-map-js 1.2.2 security fix.');
          }

          for (const key of new Set([...Object.keys(upstreamPackage), ...Object.keys(customPackage)])) {
            if (['version', 'resolved', 'integrity'].includes(key)) continue;
            if (JSON.stringify(upstreamPackage[key]) !== JSON.stringify(customPackage[key])) {
              throw new Error(`Unexpected source-map-js lock metadata change: ${key}`);
            }
          }

          custom.packages[packagePath] = upstreamPackage;
          if (JSON.stringify(custom) !== JSON.stringify(upstream)) {
            throw new Error('The package-lock contains changes beyond the reviewed source-map-js security fix.');
          }
          console.log('The package-lock differs only by the reviewed source-map-js 1.2.2 security fix.');
          NODE
          fi

          # The upstream repository and this fork have independent histories.
          # Validate the synchronized tree instead of requiring the upstream
          # commit to be an ancestor of the custom commit. These paths are the
          # maintained fork contract; every other path must match the upstream
          # release tree exactly.
          custom_content_paths=(
            .dockerignore
            .github/**
            .upstream-release
            deploy.sh
            docker-compose.yml
            docker-compose.sqlite.yml
            admin/account_response_builder.go
            admin/channel_monitor*
            admin/handler.go
            admin/sub2_upstream_rate.go
            admin/system_update.go
            database/api_key_usage.go
            database/billing*
            database/channel_monitor*
            database/image_user_billing_test.go
            database/postgres.go
            database/sqlite.go
            database/sub2_upstream_billing*
            database/usage_compaction_history_test.go
            docs/sub2api-upstream-billing-phase1.md
            frontend/package-lock.json
            frontend/src/api.ts
            frontend/src/components/AccountQuickConfigSheet.tsx
            frontend/src/components/ChannelMonitorConfigDialog.tsx
            frontend/src/components/Layout.tsx
            frontend/src/components/ui/tooltip.tsx
            frontend/src/lib/accountQuickConfig.ts
            frontend/src/lib/channelMonitorBilling*
            frontend/src/locales/en.json
            frontend/src/locales/zh.json
            frontend/src/pages/APIKeyUsagePortal.tsx
            frontend/src/pages/Accounts.tsx
            frontend/src/pages/ChannelMonitor.tsx
            frontend/src/pages/Usage.tsx
            frontend/src/types.ts
            proxy/handler.go
            proxy/official_model_pricing*
            proxy/sub2_upstream_probe*
          )
          compare_pathspecs=(.)
          for path in "${custom_content_paths[@]}"; do
            compare_pathspecs+=(":(exclude)${path}")
          done
          mapfile -t unexpected_paths < <(
            git diff --name-only "$upstream_tag_sha" "$SOURCE_SHA" -- "${compare_pathspecs[@]}"
          )
          if (( ${#unexpected_paths[@]} > 0 )); then
            echo "The validated custom commit differs from upstream ${upstream_tag} outside the maintained custom contract:" >&2
            printf ' - %s\n' "${unexpected_paths[@]}" >&2
            exit 1
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${upstream_tag}" >/dev/null 2>&1; then
            echo "Release ${upstream_tag} already exists; nothing to promote."
            exit 0
          fi

          existing_tag_sha=$(git ls-remote origin "refs/tags/${upstream_tag}^{}" | awk 'NR == 1 { print $1 }')
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" == "$SOURCE_SHA" ]]; then
            echo "Remote tag ${upstream_tag} already points to ${SOURCE_SHA}; reusing it."
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$existing_tag_sha" ]]; then
            if ! git merge-base --is-ancestor "$existing_tag_sha" "$SOURCE_SHA"; then
              echo "Remote tag ${upstream_tag} points to unrelated commit ${existing_tag_sha}." >&2
              exit 1
            fi
            echo "Remote tag ${upstream_tag} already points to an ancestor; no new tag is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$upstream_tag" "$SOURCE_SHA" \
            -m "Release ${upstream_tag} with upstream ${upstream_tag} and fork billing support"
          git push origin "$upstream_tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: promote-validated-custom
    if: needs.promote-validated-custom.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.promote-validated-custom.outputs.release_tag }}
      source_ref: ${{ needs.promote-validated-custom.outputs.source_sha }}
