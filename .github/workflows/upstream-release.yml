name: Publish Custom Release

on:
  push:
    branches:
      - codex2api-custom

permissions:
  actions: read
  contents: write

concurrency:
  group: custom-release-${{ github.sha }}
  cancel-in-progress: true

env:
  UPSTREAM_REPOSITORY: james-6-23/codex2api
  TARGET_BRANCH: codex2api-custom

jobs:
  promote-validated-custom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.promote.outputs.should_release }}
      release_tag: ${{ steps.promote.outputs.release_tag }}
      source_sha: ${{ steps.promote.outputs.source_sha }}
    steps:
      - name: Checkout validated custom commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checks and promote the upstream version
        id: promote
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          ci_conclusion=""
          security_conclusion=""
          for attempt in $(seq 1 60); do
            runs_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&event=push&per_page=100")
            ci_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "CI" and .head_branch == env.TARGET_BRANCH) | .conclusion] | last // ""' <<< "$runs_json")
            security_conclusion=$(jq -r '[.workflow_runs[] | select(.name == "Security Scan" and .head_branch == env.TARGET_BRANCH) | .conclusion] | last // ""' <<< "$runs_json")
            ci_status=$(jq -r '[.workflow_runs[] | select(.name == "CI" and .head_branch == env.TARGET_BRANCH) | .status] | last // ""' <<< "$runs_json")
            security_status=$(jq -r '[.workflow_runs[] | select(.name == "Security Scan" and .head_branch == env.TARGET_BRANCH) | .status] | last // ""' <<< "$runs_json")
            if [[ "$ci_conclusion" == "success" && "$security_conclusion" == "success" ]]; then
              break
            fi
            if [[ "$ci_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure)$ || "$security_conclusion" =~ ^(failure|cancelled|timed_out|action_required|startup_failure)$ ]]; then
              echo "CI or Security Scan failed: CI=${ci_conclusion:-$ci_status}, Security=${security_conclusion:-$security_status}" >&2
              exit 1
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "Timed out waiting for CI and Security Scan: CI=${ci_conclusion:-$ci_status}, Security=${security_conclusion:-$security_status}" >&2
              exit 1
            fi
            sleep 20
          done

          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          upstream_tag=$(git ls-remote --tags --refs upstream 'v[0-9]*' \
            | awk -F/ '{print $3}' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1)
          if [[ ! "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "No semver upstream tag is available; no release will be promoted."
            exit 0
          fi

          git fetch --no-tags upstream "refs/tags/${upstream_tag}:refs/tags/upstream-${upstream_tag}"
          upstream_tag_sha=$(git rev-parse "refs/tags/upstream-${upstream_tag}^{commit}")
          if ! git merge-base --is-ancestor "$upstream_tag_sha" "$SOURCE_SHA"; then
            echo "The validated custom commit does not contain the upstream release ${upstream_tag}; no release will be promoted."
            exit 0
          fi

          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$upstream_tag" >> "$GITHUB_OUTPUT"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${upstream_tag}" >/dev/null 2>&1; then
            echo "Release ${upstream_tag} already exists; nothing to promote."
            exit 0
          fi

          existing_tag_sha=$(git ls-remote origin "refs/tags/${upstream_tag}^{}" | awk 'NR == 1 { print $1 }')
          if [[ -n "$existing_tag_sha" && "$existing_tag_sha" != "$SOURCE_SHA" ]]; then
            if ! git merge-base --is-ancestor "$existing_tag_sha" "$SOURCE_SHA"; then
              echo "Remote tag ${upstream_tag} points to unrelated commit ${existing_tag_sha}." >&2
              exit 1
            fi
            echo "Remote tag ${upstream_tag} already points to an ancestor; no new tag is needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$upstream_tag" "$SOURCE_SHA" \
            -m "Release ${upstream_tag} with upstream ${upstream_tag} and fork billing support"
          git push origin "$upstream_tag"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  publish-release:
    needs: promote-validated-custom
    if: needs.promote-validated-custom.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      release_tag: ${{ needs.promote-validated-custom.outputs.release_tag }}
      source_ref: ${{ needs.promote-validated-custom.outputs.source_sha }}
